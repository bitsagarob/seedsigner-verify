<text x="85.2" y="31.3" font-size="2.2" fill="#cfe0ff" >no connection</text>
<rect x="6" y="35" width="56" height="30" rx="2" fill="#0a2456" stroke="#5aa9ff" stroke-width="0.5"/>
<text x="9" y="40.5" font-size="3" fill="#5aa9ff" font-weight="700">Screen, 240 x 240</text>
<text x="9" y="45.5" font-size="2.5" fill="#ffffff" >ST7789 controller sits inside the screen</text>
<text x="9" y="49.5" font-size="2.5" fill="#ffffff" >DIN 19 · CLK 23 · CS 24 · DC 22 · RST 13</text>
<text x="9" y="53.5" font-size="2.5" fill="#ffffff" >C1: one 100 nF capacitor on its 3.3 V</text>
<text x="9" y="57.5" font-size="2.5" fill="#ffffff" >Ribbon soldered straight onto the board</text>
<rect x="6" y="68" width="56" height="27" rx="2" fill="#0a2456" stroke="#fdbd00" stroke-width="0.5"/>
<text x="9" y="73.5" font-size="3" fill="#fdbd00" font-weight="700">Backlight switch</text>
<text x="9" y="78.5" font-size="2.5" fill="#ffffff" >Q1: S8050 transistor, 3 legs</text>
<text x="9" y="82.5" font-size="2.5" fill="#ffffff" >R1 10 ohm · R2 10k · R3 1k</text>
<text x="9" y="86.5" font-size="2.5" fill="#ffffff" >BL on pin 18 turns the light on and off</text>
<rect x="66" y="35" width="46" height="30" rx="2" fill="#0a2456" stroke="#3ecf8e" stroke-width="0.5"/>
<text x="69" y="40.5" font-size="3" fill="#3ecf8e" font-weight="700">Joystick S1</text>
<text x="69" y="45.5" font-size="2.5" fill="#ffffff" >LEFT 29 · UP 31 · PRESS 33</text>
<text x="69" y="49.5" font-size="2.5" fill="#ffffff" >DOWN 35 · RIGHT 37</text>
<text x="69" y="53.5" font-size="2.5" fill="#ffffff" >Common side to ground</text>
<rect x="66" y="68" width="46" height="27" rx="2" fill="#0a2456" stroke="#ff9f43" stroke-width="0.5"/>
<text x="69" y="73.5" font-size="3" fill="#ff9f43" font-weight="700">Buttons K1 to K3</text>
<text x="69" y="78.5" font-size="2.5" fill="#ffffff" >KEY1 40 · KEY2 38 · KEY3 36</text>
<text x="69" y="82.5" font-size="2.5" fill="#ffffff" >Other side to ground</text>
<rect x="116" y="35" width="38" height="60" rx="2" fill="#0a2456" stroke="#ffffff" stroke-width="0.5"/>
<text x="135" y="52" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">11</text>
<text x="135" y="59" font-size="2.8" fill="#cfe0ff" text-anchor="middle">parts in total</text>
<text x="135" y="66" font-size="2.4" fill="#cfe0ff" text-anchor="middle">Socket, screen, C1,</text>
<text x="135" y="69.6" font-size="2.4" fill="#cfe0ff" text-anchor="middle">Q1, R1, R2, R3,</text>
<text x="135" y="73.2" font-size="2.4" fill="#cfe0ff" text-anchor="middle">joystick, 3 buttons.</text>
<text x="135" y="76.8" font-size="2.4" fill="#cfe0ff" text-anchor="middle"></text>
<text x="135" y="80.4" font-size="2.4" fill="#ffffff" text-anchor="middle">No chip on the board.</text>
<text x="135" y="84" font-size="2.4" fill="#ffffff" text-anchor="middle">The only chip is inside</text>
<text x="135" y="87.6" font-size="2.4" fill="#ffffff" text-anchor="middle">the screen.</text>

# verify.bitsaga.be
#
# Static only. No PHP, no proxy, no upstream. The document root is a plain git
# checkout of this repository, so deploying is `git pull` and nothing else.
#
#   sudo install -o rob -g www-data -d /srv/verify.bitsaga.be
#   git clone https://github.com/bitsagarob/seedsigner-verify /srv/verify.bitsaga.be
#   sudo ln -s /etc/nginx/sites-available/verify.bitsaga.be /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d verify.bitsaga.be
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name verify.bitsaga.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verify.bitsaga.be;

    root /srv/verify.bitsaga.be;
    index index.html;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/verify.bitsaga.be/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/verify.bitsaga.be/privkey.pem;

    # Real headers, not just the meta tag in index.html. The meta tag stays so
    # the page is equally locked down when served from anywhere else.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Never serve the repository's own plumbing.
    location ~ /\.git { deny all; return 404; }

    # The docs are linked from the page, so serve them as readable text.
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff2|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # release.json and the code must never be served stale after a firmware update.
    location ~* \.(html|json|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Own log file so Matomo's log importer can read this site alone.
    access_log /var/log/nginx/verify.bitsaga.be.access.log combined;
    error_log  /var/log/nginx/verify.bitsaga.be.error.log;
}

# verify.bitsaga.be  -  the live server block, kept in sync with the box.
#
# Static only. No PHP, no proxy, no upstream, no build step. The document root is
# a plain git checkout of this repository, so deploying is `git pull`.
#
#   sudo install -d -o rob -g rob /srv/verify.bitsaga.be
#   git clone https://github.com/bitsagarob/seedsigner-verify /srv/verify.bitsaga.be
#   sudo ln -s /etc/nginx/sites-available/verify.bitsaga.be /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d verify.bitsaga.be
#   sudo nginx -t && sudo systemctl reload nginx
#
# The security headers live in snippets/verify-headers.conf because nginx
# add_header does NOT merge: any add_header inside a location silently discards
# every header inherited from the server block. Every location that sets one of
# its own must include the snippet too, or it serves no CSP at all.

server {
    listen 80;
    listen [::]:80;
    server_name verify.bitsaga.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verify.bitsaga.be;

    root /srv/verify.bitsaga.be;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/verify.bitsaga.be/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/verify.bitsaga.be/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include snippets/verify-headers.conf;

    location ~ /\.git { deny all; return 404; }


    location ~* \.md$ { default_type text/plain; charset utf-8; }

    location ~* \.(woff2|png|svg|ico)$ {
        expires 30d;
        include snippets/verify-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(html|json|js|css)$ {
        include snippets/verify-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/verify.bitsaga.be.access.log combined;
    error_log  /var/log/nginx/verify.bitsaga.be.error.log;
}
